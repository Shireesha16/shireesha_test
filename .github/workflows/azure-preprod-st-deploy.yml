name: Azure Pre-Production Deploy (ST)
 
on:
  push:
    branches: [pre-prod]
  workflow_dispatch:
 
# Prevent concurrent deployments
concurrency:
  group: azure-preprod-deploy
  cancel-in-progress: false
 
jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Azure Static Web Apps (Pre-Production - ST)
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false
 
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
 
      - name: Install dependencies
        run: npm ci --include=dev
 
      - name: Build Next.js application
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL_PREPROD }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL_PREPROD }}
          API_INTERNAL_BASE_URL: ${{ vars.API_INTERNAL_BASE_URL_PREPROD }}
 
      - name: Deploy to Azure Static Web Apps
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PREPROD }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/"
          api_location: ""
          output_location: ".next"
          skip_app_build: true
 
      - name: Deployment summary
        run: |
          echo "### Pre-Production Deployment Complete (ST)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Environment: Pre-Production (Azure ST)" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: pre-prod" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Site URL: ${{ vars.NEXT_PUBLIC_SITE_URL_PREPROD }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Test the deployment: Visit the site URL above to verify." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Note: Staging/QA/Production remain on Cloudflare." >> $GITHUB_STEP_SUMMARY
 
      - name: Comment on PR (if applicable)
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Pre-Production deployment complete (ST).\n\nPreview URL: ${{ vars.NEXT_PUBLIC_SITE_URL_PREPROD }}\n\nPlease test before merging.`
            })
